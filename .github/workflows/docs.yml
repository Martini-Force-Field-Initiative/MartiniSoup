name: Docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same Python as .readthedocs.yaml.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked --no-dev

      # -W turns warnings into errors (broken references, bad reST, failed
      # autodoc imports); --keep-going reports all of them, not just the first.
      - name: Build HTML
        run: >-
          uv run --locked --no-dev --with-requirements docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14
