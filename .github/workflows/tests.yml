name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full range allowed by requires-python. uv.lock resolves
        # different dependency versions across it (e.g. MDAnalysis 2.9 on
        # 3.10, 2.11 on 3.11+), so each version is worth testing.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install
        run: uv sync --locked

      - name: Unit tests
        run: uv run --locked pytest -m "not integration"

      - name: Integration tests
        run: uv run --locked pytest -m integration
